#
# SCPU-EMU bus timing configuration
#
# Raspberry Pi Zero 2 W profile.
#
# The Zero 2 clocks slightly differently from a 3B+ under load, so these are a
# STARTING POINT ONLY and have not been validated on hardware. If takeover is
# unreliable, tune with the stock RAD software first (see Docs/hardware-setup.md)
# and copy the working values here.
#
# Copy to SCPU/scpu.cfg on the SD card.
#
# These are RAD's AUTO_TIMING_RPI3PLUS_C64C128 defaults, which the firmware
# applies before reading this file -- so an empty config is the same as this
# one. Any value set here overrides the built-in default; a value of 0 (or an
# absent line) leaves the default in place.
#
# Units are ARM cycles measured from the falling edge of PHI2, counted against
# PMCCNTR_EL0. At ~1.4GHz one C64 cycle is roughly 1400 of them.
#
# If the C64 hangs on takeover or the display corrupts, these are what to
# adjust. The reliable way to find good values is to tune them with the stock
# RAD software first -- the parameter names are identical -- then copy the
# working numbers here. See Docs/hardware-setup.md.
#

# --- signal sampling -------------------------------------------------------
WAIT_FOR_SIGNALS              60
WAIT_CYCLE_MULTIPLEXER        220
WAIT_CYCLE_READ               475
WAIT_CYCLE_WRITEDATA          470

# --- VIC-II / badline variants (unused by SCPU-EMU today) ------------------
WAIT_CYCLE_READ_BADLINE       400
WAIT_CYCLE_READ_VIC2          445
WAIT_CYCLE_WRITEDATA_VIC2     505
WAIT_CYCLE_MULTIPLEXER_VIC2   265

# --- DMA handover ----------------------------------------------------------
WAIT_TRIGGER_DMA              600
WAIT_RELEASE_DMA              600

# Delay after the falling edge of PHI2 before /DMA is asserted, once a badline
# has been detected. 0 means "immediately".
TIMING_TRIGGER_DMA            0

# --- level shifter and latch timing ----------------------------------------
WAIT_OFFSET_CBTD              10
WAIT_DATA_HOLD                22
WAIT_ENABLE_ADDRLATCH         500
WAIT_READ_BA_WRITING          325
WAIT_ENABLE_RW_ADDRLATCH      425
WAIT_ENABLE_DATA_WRITING      700
WAIT_BA_SIGNAL_AVAIL          280
