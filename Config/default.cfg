#
# SCPU-EMU bus timing configuration
#
# Copy to SCPU/scpu.cfg on the SD card.
#
# These are the values from the RAD Expansion Unit's own shipped rad.cfg, not
# the firmware's built-in defaults. Prefer them: they are what the stock RAD
# software runs with, so on any machine where RAD works they are already known
# good.
#
# Units are ARM cycles measured from the falling edge of PHI2, counted against
# PMCCNTR_EL0. The clock in config.txt is therefore part of this configuration:
# at 1400MHz one C64 half-cycle is about 710 ARM cycles on PAL and only about
# 684 on NTSC. Any value that has to complete inside the CPU half-cycle must fit
# in that budget, which is why NTSC needs lower numbers than PAL -- see the NTSC
# section at the bottom.
#

# --- which CPU core ---------------------------------------------------------
#
#   1  WDC 65C816 -- the processor a real CMD SuperCPU contains, and the default.
#      Boots in emulation mode, where it behaves as a 6502, so a stock KERNAL and
#      ordinary C64 software run unchanged. Software that knows about the
#      accelerator can switch it to native mode for 16-bit registers, 24-bit
#      addressing and the 16MB of SuperRAM.
#
#   0  MOS 6502 -- the earlier, simpler core, kept as a fallback. Everything a
#      normal C64 does still works, but SuperRAM is unreachable: a 6502 has no
#      way to name an address above $FFFF.
#
# If something misbehaves after an update, setting this to 0 is the quickest way
# to find out whether the CPU core is responsible.
CPU_CORE 1

# --- SuperCPU boot ROM ------------------------------------------------------
#
#   1  Let the SuperCPU's own ROM run at reset, the way a real card does. It is
#      mapped over $8000-$CFFF and $E000-$FFFF, so the machine resets into CMD's
#      code and you get the SuperCPU banner before BASIC. The boot code maps
#      itself out again and hands over to the C64's KERNAL.
#
#   0  Skip it. The machine boots straight into its own KERNAL and shows the
#      ordinary Commodore 64 screen. $F80000 still reads the ROM image.
#
# Needs SCPU/scpu.rom to be present and at least 64K; without it this is ignored
# and the machine boots its own KERNAL either way.
#
# IF THE MACHINE DOES NOT BOOT, SET THIS TO 0. The Pi reads this file before any
# emulation starts, so it always takes effect no matter how badly the emulated
# machine behaves.
BOOTMAP 1

# --- C128 operating mode ----------------------------------------------------
#
#   0  Auto-detect from the post-handoff $FF01-$FF04 MMU/KERNAL view. This is
#      the normal setting for a C64, 64U, or C128 started with the C= key.
#   1  Force the established C64 SuperCPU path after acquisition. Diagnostic
#      override only; it does not select the physical takeover sequence.
#   2  Force experimental native-C128 mode.
#
# Physical machine type and operating mode are different on a C128. In
# particular, $0001 is internal to the 8502 and cannot be used by a DMA master
# to discover which mode was selected.
C128_MODE 0

# --- JiffyDOS switch -------------------------------------------------------
#
#   1  JiffyDOS enabled (default). CMD's boot code installs its accelerated
#      KERNAL when the SuperCPU ROM runs.
#
#   0  JiffyDOS disabled. CMD's boot code installs the non-Jiffy KERNAL path.
#
# This is the virtual replacement for the physical switch on a real SuperCPU.
# A runtime POKE 53429,128 or POKE 53429,0 changes it until the Pi reboots; a Pi
# reboot reads this setting again.
JIFFYDOS 1

# --- mirroring inside the visible display -----------------------------------
#
# Visible-display delivery allowance in the original eight-drain units. The
# scheduler now spreads it over 128 points per frame, avoiding long pauses while
# keeping comparable total throughput. At the default, each installment is
# about 64 bytes / 64us rather than one 1024-byte / 1ms stop.
#
# 1024 gives roughly 8KB/frame. 0 restores strict border-only mirroring. Larger
# values increase both throughput and each installment proportionally.
MIRROR_DISPLAY_BYTES 1024

# Targeted convergence for sparse stored-data changes observed on bitmap
# screens while the VIC actively fetches display DRAM on a physical C64. The
# repair covers the bitmap matrix/data and enabled sprite blocks in 32-byte
# hidden-raster installments, only after ordinary queued writes have drained.
# Text/charset mode is deliberately excluded: enabling scrub while GEOS was
# still in its text loader prevented the loader reaching the bitmap desktop.
# Leave disabled until bitmap-only hardware trials validate it.
DISPLAY_SCRUB 0
# 1 repairs the measured vulnerable address class (A1=0,A3=1; one quarter of
# display RAM). 0 is the slower full-coverage fallback.
DISPLAY_SCRUB_MASK 1
# Trial-only self control. N alternates N seconds off, then N seconds on.
# Physical read/compare sampling is deliberately not performed: some machines
# have no calibrated stable read window. 0 keeps the configured static state.
DISPLAY_SCRUB_PERIOD_S 0

# What the Raspberry Pi HDMI connector displays. This does NOT change how the
# C64's own screen is driven -- the physical VIC-II does that in every mode.
#
#   0  firmware text console (DEFAULT; safe baseline, runtime path unchanged)
#   1  VIC-II picture from the Pi's emulated-memory shadow -- EXPERIMENTAL
#   2  C128 VDC picture (reserved for future native C128 support)
#
# Mode 1 is experimental and defaults OFF. The Pi has to reconstruct the picture
# from its shadow while simultaneously meeting the C64's bus timing, and the two
# compete for the same scarce resource. Because of those timing and bandwidth
# limits it may not give the output you expect: artefacts, missing updates, or
# reduced fidelity on demanding software. Text, bitmap, multicolour, sprites and
# raster replay are implemented, but mode 1 is not yet the validated baseline.
#
# Mode 0 is the baseline to fall back to, and the mode to diagnose from: a video
# mode change is not a small variable in a machine whose correctness rests on bus
# timing, so anything being investigated elsewhere should be tested here.
VIDEO_MODE 0

CACHING_L1_WINDOW_KB 3
CACHING_L2_OFFSET_KB 3
CACHING_L2_PRELOADS_PER_CYCLE 10

# --- boot animation ----------------------------------------------------------
#
#   1  Run the C64 startup animation that SuperCPU DOS 2.04 carries but skips
#      (default). The ROM decides at one closed-bank read of $D20C; answering
#      that single read with the zeroed VIC register underneath takes the
#      animation branch. A deliberate one-byte deviation from strict fidelity.
#
#   0  Faithful: the read answers from the accelerator's own RAM (as VICE
#      does) and 2.04 boots straight to its banner, animation skipped.
BOOT_ANIMATION 1

# --- under-I/O sprite-shape relocation ---------------------------------------
#
#   1  (default) A VIC-bank-3 game can keep sprite shapes in RAM at
#      $D000-$DFFF: the VIC fetches DRAM there, but our mirror writes cannot
#      follow -- the halted 6510 keeps the real machine's I/O banked in, so a
#      bus write lands on a chip register instead of DRAM. Such shape blocks
#      are relocated on first use to free blocks at $C000-$CBFF and the
#      sprite POINTERS are delivered translated, so the real VIC fetches an
#      identical copy from an address we can reach. The program itself always
#      reads back its own faithful values. 3D Pool /SCPU double-buffers
#      across VIC banks 1 and 3 with thirty shape blocks under I/O; without
#      this its balls alternate between correct and garbage at frame rate.
#
#   0  Off: under-I/O shape blocks show whatever real DRAM happens to hold
#      (the pre-relocation behaviour).
MIRROR_D000_RELOCATE 1

# --- physical RAM under I/O -------------------------------------------------
#
# A real SuperCPU parks the stopped 6510 at $01=$34 so physical DRAM remains
# reachable at $D000-$DFFF, then asserts /GAME only for actual VIC/SID/CIA
# accesses. Analog C64 cartridge logic handles that correctly. The synchronous
# cartridge logic in the tested 64U carries those short /GAME selections into
# VIC fetches, causing visible sparkle during any I/O activity.
#
#   0  (default) Always use the conventional-map compatibility fallback.
#      Active bank-3 display data is relocated into VIC-visible backing RAM,
#      so this avoids sparkle without losing bitmaps or matrices under I/O.
#   1  Force full RAM-under-I/O mode, including K397's extended /GAME setup.
#   2  Experimental AUTO: try the standard takeover three times. A host which
#      only accepts the extended sequence is treated as synchronous and falls
#      back. This is not recommended as a general host detector.
#
# AUTO is a two-host behavioural proxy, not a direct test of VIC output: the Pi
# cannot observe the physical video signal, and the tested 64U accepts the
# standard takeover even though per-access /GAME makes its VIC sparkle.
RAM_UNDER_IO 1

# --- VSP placement calibration (diagnostic) ----------------------------------
#
# Shift the cycle-exact placement of physical VIC accesses by this many C64
# cycles. Positive lands the access LATER. Range -6..+6; out-of-range reads as
# 0. These exist to CALIBRATE: a VSP screen's horizontal shift is a direct
# readout of the machine's end-to-end placement constant, one column per cycle.
# Sweep VSP_AIM_WRITE until the shift is zero; that value is the measured
# constant, and belongs in a bug report rather than in a permanent config.
VSP_AIM_READ 1
# SWEEP POINT 1. Scott reports left-edge content wrapping to the right by
# about 1.5-2 columns. At one column per cycle that says the physical write
# lands about two cycles EARLY: fewer c-accesses than intended, so content
# is fetched from earlier addresses and appears pushed right. Positive
# lands it later. If the wrap DOUBLES instead of closing, the sign is wrong
# and the next point is -2. This is a CALIBRATION value, not a setting to
# keep: whatever zeroes the wrap is the measured constant and belongs in a
# proper fix, not here.
# SWEEP, now valid for the first time. The simulation shows the window is
# 6.00 cycles when the VIC's steal MISSES the DEC/INC pair and 6 + steal when
# it hits, so the machine already produces a correct window at the right
# phase and the job is to move the pair out of the steal rather than to make
# the bus cheaper. Earlier sweeps were invalid because the pair's placement
# jittered by 4 cycles frame to frame; that is now 0.07, so a shift here
# moves a stable target. +6 is the maximum and the most likely to clear a
# 7-cycle steal window in one step; if it overshoots, the clean phase is
# between 0 and 6 and the next point bisects.
VSP_AIM_WRITE 0

# THE LATE-CASE FIX, off by default (K500). 1 serves a $D011 read made inside
# the raster window -- a $D012 read at 1MHz within the last 200 cycles, whose
# low byte proves the raster MSB is 0 -- from the register shadow instead of
# the bus. The value is the same (bits 6..0 are already shadow-served); the
# 2.3-cycle transfer and the turnaround it forces on the following write are
# gone, so Mario's DEC/INC pair reaches its count target early every frame
# and the catch-up places it exactly. Exact value 1 only. Pair with
# VSP_AIM_WRITE for the constant; this one removes the frame-to-frame part.
VSP_D011_SHADOW_READ 1

# THE WRITE LEAD (K502), quarter C64 cycles 0..3. The settle that places a VIC
# write exits this much before the pacer's lock phase, so the write's entry into
# the bus primitive lands in the middle of the cycle before the one it drives
# in rather than on that cycle's falling edge. Measured on the card with the
# shadow read on: the entry sat 0.46 cycle past the lock phase on every frame
# and the oracle letters flickered 0/+1. 2 centres the entry; 0 is the old
# placement. Not a calibration of the picture: it moves nothing by whole
# cycles, it only chooses where inside the cycle the primitive is entered.
VSP_WRITE_LEAD 2

# BISECT KEY (K505): 1 = K501's placement inside a raster window (pass inside
# the write's resync, lag 1, catch-up target on the anchor read's cycle start);
# 0 = K500's placement for those three. Mario needs 1 together with the keys
# above; this exists to find which of the three Metal Dust's intro objects to.
VSP_PLACEMENT_K501 1

# TRACE FILTER (K506): 1 keeps only raster-window VIC writes in the vsp trace
# ring, so an intro's timed writes survive until the card is pulled. Diagnostic.
VSP_TRACE_WINDOW_ONLY 0

# --- emulated BA stall -------------------------------------------------------
#
# While the VIC-II holds BA -- a badline, or the three cycles before each
# sprite fetch -- a real 6510 is FROZEN. It cannot fetch, so a NOP sled stops
# advancing and an interrupt that arrives during the steal is taken at the
# first instruction after it. Our opcode fetches come from the Pi's shadow and
# touch no bus, so without this the emulated CPU races through every steal.
#
# Measured consequences of NOT doing it (K451, on hardware): Mario's 24-NOP IRQ
# stabiliser is overrun, the second IRQ lands at $0849 inside the DEX loop
# instead of in the sled, TXS writes S = $0100 + X = $0104, and the machine
# ends spinning on $9F88 with the music stuck on one note. The same miss closes
# the VSP window early -- the $D011 INC completes six cycles after the DEC
# instead of at cycle 59, which is the residual two-column screen wrap.
#
#   0  Off. The K451 behaviour, kept for A/B only.
#   1  (default) On, EXCEPT while a serial transaction window is armed. Our
#      IEC edges reach a real drive through the physical CIA and the drive has
#      no model of our freeze, so JiffyDOS and the KERNAL's bit-banged serial
#      keep the exact path hardware testing already validated.
#   2  Always, including during IEC. This is the faithful setting -- a real C64
#      does take badlines while loading -- and is the next A/B rather than the
#      default: a 43us insertion into a drive handshake is the one thing in
#      this change that can break an already-validated path.
#
# Only ever applied at an effective 1MHz. In turbo the accelerator runs from
# its own SRAM, where BA is irrelevant, and the C64 accesses it does make
# already wait for BA inside the bus primitives.
BA_STALL 1

# Ceiling on ONE freeze, in C64 cycles, 8..80. A badline holds the CPU from
# cycle 12 to 54 (43 cycles) and sprite DMA can carry that across a line
# boundary, so one NTSC line plus margin covers every legitimate steal and
# anything longer is a fault rather than a long badline. 80 is the top of the
# range because RAD_BA_STALL_CEILING clamps there regardless. The bus side
# latches the sampler off after sixteen consecutive ceiling hits, because
# spending the ceiling on every instruction would be a 60x slowdown --
# indistinguishable from the freeze the ceiling exists to prevent.
BA_STALL_MAX 80

# --- serial-transaction window ----------------------------------------------
#
# Two windows decide that the serial bus is busy: a 2ms EDGE window, which
# suppresses screen mirroring (iecBusActive), and a 100ms HOLD, which forces
# 1MHz pacing. Both are armed by CC64Memory::noteIECActivity.
#
# MEASURED, K456 on hardware: during pure Mario gameplay, with no drive access
# whatsoever, BA_STALL 1 declined 2751432 stall samples against 50319 taken --
# the window was armed 98% of the time. The IEC drivers on CIA2 PA3-PA5 are
# inverting open collectors on a wired-AND bus, so a latch bit the guest leaves
# set pulls CLK or DATA low, and the direct inputs PA6/PA7 read that same low
# back. The old predicate accepted that as "a drive is answering", so one $DD00
# read per frame -- a VIC-bank switch is enough -- re-armed a 100ms hold
# forever. The KERNAL itself depends on this loopback existing: ACPTR releases
# CLK at $EE85 before waiting for CLK high at $EE1B.
#
#   0  Legacy. Any asserted input level, and any change of the IEC outputs,
#      arms. Kept for A/B only.
#   1  (default) A line THE GUEST IS PULLING DOWN is not evidence. Input
#      edges, output changes, and a drive holding a line we released all still
#      arm, so nothing is removed from a real transaction.
#   2  Positive evidence only. A window OPENS on an ATN assertion -- which
#      every KERNAL and JiffyDOS conversation begins with -- or on an input
#      edge; a held level or a non-ATN output change may only RE-arm one that
#      is already open. This is the next A/B, not the default.
#
# Neither mode touches notePollHold(), which still tops the 1MHz speed up on
# EVERY $DD00/$DD02 access -- that, not these windows, is what the KERNAL's
# bit-banged timing rests on. The hardware test that proves a mode safe is a
# DIRECTORY and a LOAD of a real .d64 through a real drive; read the iecwin:
# diagnostic line for hold/txn and read-refused.
IEC_WINDOW 1

# --- HANG FORENSICS ----------------------------------------------------------
#
#   HANG_WATCH is a detector built from the DEFINITION of a hang rather than
#   from a theory about one: it watches whether the set of code addresses the
#   machine executes is still acquiring new members, and freezes the 64-entry
#   interrupt ring when it stops. It knows nothing about stacks, vectors or
#   rasters, which is the point -- the previous detector tested S < $0110, the
#   signature of the hang it was written for, and reported stack-anomalies=0 on
#   a machine that was visibly hung by a different mechanism.
#
#     0  off
#     1  on (default)
#
#   It confirms only after 8.4 seconds of unbroken zero novelty, so a disk load
#   sitting in a tight loop cannot trip it, and leaving it on costs a normal run
#   nothing. The post-mortem prints what it measured whether or not it fired.
HANG_WATCH 1

#   RAM_WATCH / RAM_WATCH2 log the last 32 writes to one or two RAM addresses
#   with value, previous value, writer PC and cycle. DECIMAL, because the config
#   parser is atoi, and 0 disarms a slot -- so $0000 is the one address that
#   cannot be watched from here.
#
#   40840 = $9F88, Mario's frame-phase index: the byte the main loop at $A765
#   spins on and the IRQ chain writes at $09B0 STY $9F88. The ring separates
#   "never written" from "written the same value" from "written correctly and
#   read from somewhere else", which is three different bugs with one symptom.
#
#   COST: a watch adds its address's 4K page to the write-notify bitmap, so
#   every write into that page takes an out-of-line call it did not take before.
#   Page $9 is cheap in Mario. A page-$0 watch would put that call on every
#   zero-page and stack store and must be measured before it ships. Both slots 0
#   reproduces the pre-change bitmap exactly.
RAM_WATCH 40840
RAM_WATCH2 0

# --- diagnostic-minimal mode -------------------------------------------------
#
#   0  (default) Every instrument stays armed. The 2026-10-12 hang is open, so
#      this is not negotiable for a default boot: HANG_WATCH's progress
#      detector, the interrupt ring, RAM_WATCH and the VSP trace are all still
#      producing the evidence the investigation runs on.
#   1  Drop the instruments that only answer questions already closed. Today
#      that is the K449 per-stage bus timers (busstage rsync=/rvic=/rcpu=/
#      wsync=/wp1turn=/wp1plain=/wp2=). bastall-r/w and bastall-wturn SURVIVE:
#      they are two compares and the open BA-stall question still quotes them.
#
#   WHY IT EXISTS. Verified in the rebuilt rad_bus.o: radAccumRead and
#   radAccumWrite are each inlined TWICE into their transfer primitive -- once
#   for radBusStages and again, under the $D000-$DFFF test, for
#   radBusStagesIO -- so every physical I/O access runs two ~40-instruction
#   accumulator bodies against a measured unstalled floor of 639 ARM plain and
#   2001 turnaround.
#
#   WHY IT IS A BOOT OPTION AND NOT A REBUILD. The TI benchmark CANNOT see
#   this: its loop runs entirely out of Pi RAM and never touches the expansion
#   port. The only honest A/B is a real Mario run, which means two boots on the
#   card. Every TI figure in CHT was measured with this at 0.
#
#   WHAT THIS KEY DOES NOT COVER. m_RamWrites and m_MirrorFloorSkipped are 3
#   ARM instructions each on every bank-0 DRAM store, verified at
#   CW65C816::write8+0xc0 and +0xe4 in the -Os object. A runtime gate would
#   cost 2 instructions to save 3, so they use the compile-time
#   SCPU_DIAG_WRITE_COUNTERS gate in Source/C64/c64_memory.h instead, exactly
#   as SCPU_COUNT_ACCESS already does in Source/SuperCPU/memory_map.h. Build
#   with -DSCPU_DIAG_WRITE_COUNTERS=0 and stage it as its own kernel image for
#   that A/B.
DIAG_MINIMAL 0

# --- CIA2 timer NMI retiming -------------------------------------------------
#
#   1  (default) When a program arms a CIA2 timer interrupt as its NMI source,
#      deliver that NMI at the exact emulated cycle the timer writes imply,
#      instead of when the physically sampled line happens to be seen (up to a
#      microsecond late, at an instruction-batch boundary). Cycle-timed
#      loaders depend on the NMI landing at a known instruction: the Winter
#      Games SCPU fix fires a 20-cycle one-shot timer NMI per transfer chunk
#      and keeps native-mode 65816 windows whose only protection is that the
#      NMI never lands inside them. While a timer NMI is armed the timers own
#      the line entirely; RESTORE and FLAG pass through normally otherwise.
#
#   0  Sampled-line delivery for everything (the old behaviour).
NMI_RETIME 1

# --- interrupt vector reroute ------------------------------------------------
#
#   1  (default) Fetch interrupt vectors from the accelerator's own EPROM at
#      $F80000+vector, the way a real SuperCPU does. Its EPROM carries a
#      genuine 65816 vector table pointing at trampolines ($FCA4 = JML
#      $00C003 for NMI, $FC94 = JML $00FBE1 for IRQ/BRK), which is why the
#      KERNAL images can hold the ordinary C64 jump table across $FFE4-$FFEF
#      and why a 65816 program may keep its own code at those addresses.
#      VICE models this as scpu64_interrupt_reroute(). It applies only when
#      page $FF comes from the accelerator's KERNAL window AND the processor
#      is in native mode or the card has its registers open / is in system
#      1MHz / DOS-extension / RAMLink state -- ordinary C64 operation in
#      emulation mode is unaffected and uses the KERNAL's own vectors.
#
#   0  Fetch vectors from the C64 map, as this emulator did before.
VECTOR_REROUTE 1

# --- C64 bus access cost -----------------------------------------------------
#
#   1  Charge every access that reaches the real C64 bus a whole
#      C64 cycle, the way a real SuperCPU pays for one: the accelerator
#      stalls until PHI2, performs the access at 1MHz, and only then runs on
#      (CIA writes cost an extra cycle). VICE charges the same in
#      scpu64_clock_read_stretch_io / _write_stretch_io_*.
#
#      This matters more than it sounds. A poll loop
#          LDA $D012 / CMP #x / BNE
#      takes exactly ONE C64 cycle per iteration on real hardware -- the
#      processor's nine cycles vanish inside the stall -- so 1000 iterations
#      are 1000 microseconds. Charging only the opcode cycles made the same
#      loop nine emulated cycles, so I/O-bound code ran several times too
#      fast and anything timing itself against a CIA landed in the wrong
#      place in its own instruction stream.
#
#      No stretch applies at 1MHz: the processor is already running at the
#      bus rate and has nothing to stall for.
#
#   0  Charge bus accesses nothing, as this emulator did before.
#
#      0 is the default on RAD and the reason is NOT recorded anywhere.
#      The leading hypothesis is that a physical bus access already costs
#      ~1us of real time that the pacer absorbs, so modelling a stretch on
#      top would charge twice -- unverified. See the open question in
#      Docs/SuperCPU64/timing-notes.md, which also gives the experiment
#      that would settle it.
IO_STRETCH 0

# --- native NMI compatibility -----------------------------------------------
#
#   1  (default) Hold a pending CIA2 NMI while the 65816 is native and release
#      it at the first emulation-mode instruction. This is not generic 65816
#      behaviour, but real-RAD testing shows Winter Games regresses at its boot
#      screen without it even after EPROM vector rerouting is enabled.
#
#   0  Dispatch native NMIs immediately through the rerouted EPROM vector.
NMI_NATIVE_DEFER 1

# --- mirrored-write timing --------------------------------------------------
#
#   0  (default) Do not charge the emulated CPU again for the card's one-deep
#      posted mirror buffer. RAD delivers those bytes later over the physical
#      C64 bus, and that delivery already consumes real time. Charging both
#      stages caused the emulator scheduler to starve and made Metal Dust's
#      scrolling visibly stutter.
#
#   1  Also model the original card's one-deep posted-buffer stalls. Useful as
#      a diagnostic comparison, but currently double-counts time on RAD.
MIRROR_STRETCH 0

# --- heartbeat ---------------------------------------------------------------
#
#   0  (default) No once-per-second status line. The line's logger write runs
#      with IRQs briefly unmasked and costs enough real time to stutter the
#      display for a barely-visible instant every second.
#
#   1  Print it: hb PC=$xxxxxx..$xxxxxx wb= iec= BA= PHI= irqbank=. Turn on
#      when diagnosing a freeze or watching what the emulated machine does.
#
# Stall self-detection stays armed either way -- the PC range is still
# sampled every frame, and a machine stuck in the same few bytes for three
# seconds dumps its state exactly as before. Only the healthy-case printing
# is optional.
HEARTBEAT 0

# --- diagnostic: halt mirroring after N seconds ------------------------------
#
# After this many seconds of uptime, STOP all mirror bus traffic (flushes and
# the background resync sweep). The display then shows exactly what real DRAM
# holds, undisturbed by the Pi. Corruption that SNAPS CLEAN when the bus goes
# quiet was fetch disturbance from our ongoing writes; corruption that
# PERSISTS with zero traffic is wrong DRAM content, meaning writes are landing
# where they should not. 0 = never halt (normal operation).
MIRROR_HALT_AFTER_S 0

# Stronger diagnostic: after N seconds, stop every physical expansion-bus
# read and write while leaving the emulated CPU running. Use this only to ask
# whether corruption continues once the RAD is electrically quiet; returning
# $FF for all physical I/O means normal software operation cannot continue.
BUS_HALT_AFTER_S 0

# Diagnostic-only physical-bus traffic classifier:
#   1 = broad non-display RAM sentinel (K221)
#   2 = displayed hires VIC-fetch sentinel with blanked readbacks (K222)
#   3 = immediate $2078 write + address-map/retention discriminator (K223)
#   4 = high-entropy display-row write/repeat/retention maps (K225)
#   5 = active text/bitmap fetch and bus-traffic discriminator (K226)
#   6 = repeated active-display persistence/readback discriminator (K227)
#   7 = exposed-map read timing and targeted-repair discriminator (K228)
#   8 = display-transition versus active-dwell discriminator (K229)
#   9 = continuous VIC-half DMA-release refresh A/B (K230)
#  10 = synchronous core-0 VIC-half DMA-release refresh A/B (K231)
#  11 = active-display floating versus held-high R/W idle A/B (K232)
#  12 = targeted displayed-memory scrub off/on A/B (K233)
#  13 = composite bitmap idle/read/write BA-resume guard A/B (K239)
# All stop before the SuperCPU core starts and save SCPU/busdiag-e18.txt. A
# cyan border and five LED blinks mean the test is complete and the card can
# be returned. Leave at 0 for every normal boot.
BUS_ACCESS_SENTINEL 0

# --- SID register reads ------------------------------------------------------
#
# When the data bus is sampled for a READ of $D400-$D7FF, in ARM cycles from
# the PHI2 edge. The SID drives the bus far later in the cycle than the VIC or
# CIAs -- a real 6510 samples at the END of the half-cycle -- so sampling SID
# reads at the shared point returns open-bus $FF for every register. Measured
# on this machine: OSC3 ($D41B) read 255 forever while a real voice-3 noise
# oscillator ran, which held Metal Dust in its RNG-seed poll loop for good.
#
# The NTSC half-cycle is ~684 ARM cycles at arm_freq=1400; keep this safely
# below it. If SID reads still come back 255, raise in steps of 10. If other
# reads misbehave, this value is not involved -- it applies to $D4xx only.
WAIT_CYCLE_READ_SID 620

# --- signal sampling -------------------------------------------------------
WAIT_FOR_SIGNALS 80
WAIT_CYCLE_MULTIPLEXER 235
WAIT_CYCLE_READ 475
WAIT_CYCLE_WRITEDATA 470

# --- DMA handover ----------------------------------------------------------
WAIT_RELEASE_DMA 520
WAIT_TRIGGER_DMA 0
TIMING_TRIGGER_DMA 0

# --- level shifter and latch timing ----------------------------------------
WAIT_OFFSET_CBTD 40
WAIT_DATA_HOLD 20
WAIT_BA_SIGNAL_AVAIL 311
WAIT_ENABLE_ADDRLATCH 535
WAIT_READ_BA_WRITING 311

# The three RAD calls out as most likely to need tweaking when it will not run
# stably. If the display is unstable or data is corrupt, lower these first.
#
# ACTIVE VALUES: the NTSC pair from the section below. This machine is NTSC
# (jiffy scan measured 60Hz); the PAL defaults 467/675 left the write's data
# window ending ~9 ARM cycles before the end of the SHORTER NTSC half-cycle,
# and a write tail overrunning into the VIC's half corrupts its fetches.
# PAL values, should this card ever move to a PAL machine:
###WAIT_ENABLE_RW_ADDRLATCH 467
###WAIT_ENABLE_DATA_WRITING 675
WAIT_ENABLE_RW_ADDRLATCH 400
WAIT_ENABLE_DATA_WRITING 625

# --- unused by SCPU-EMU, kept so the file matches RAD's ---------------------
WAIT_CYCLE_READ_BADLINE 385
WAIT_CYCLE_READ_VIC2 428
WAIT_CYCLE_WRITEDATA_VIC2 485
WAIT_CYCLE_MULTIPLEXER_VIC2 256

#
# ###########################################################################
# NTSC MACHINES, or a cartridge port expander
# ###########################################################################
#
# An NTSC C64 runs at 1.0227MHz against PAL's 0.9852MHz, so its half-cycle is
# about 3.7% shorter -- roughly 684 ARM cycles instead of 710 at arm_freq=1400.
# Timings that sit near the end of the CPU half-cycle then overrun into the
# VIC-II's half of the cycle, corrupting its fetches. The symptom is a display
# that will not stabilise rather than obviously wrong data.
#
# RAD gives the same two values as the fix for cartridge port expanders, which
# have the same effect for a different reason (added propagation delay). Comment
# out the two lines above and uncomment these:
#
###WAIT_ENABLE_RW_ADDRLATCH 400
###WAIT_ENABLE_DATA_WRITING 625
#
# RAD's note: "if still glitches -> go even a bit lower". Move in steps of
# about 10 and change only one at a time.
#
###WAIT_BA_SIGNAL_AVAIL 300
###WAIT_READ_BA_WRITING 300

# --- RAM Expansion Unit ------------------------------------------------------
#
#   A selector, NOT a size. 1 rather than 0 means "no REU", so a missing or
#   mistyped key is distinguishable from a deliberate off.
#
#     1  no REU fitted   (default)
#     2  128 KB          1700
#     3  256 KB          1764
#     4  512 KB          1750
#     5    2 MB          1750 with a common third-party expansion
#     6    4 MB
#     7   16 MB          the largest the 24-bit REU address reaches
#
#   1 MB is deliberately absent. Adding a size later means appending a new
#   selector, never renumbering these -- a card in the field must not change
#   machine because the table grew.
REUSIZE 4
